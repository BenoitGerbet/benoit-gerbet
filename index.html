        // Initialize Lucide Icons on load
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateLanguageUI();
        });

        // Tab Switching Logic
        function switchTab(tabId) {
            currentTab = tabId;
            // Hide all tab content
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // Show selected
            const activeEl = document.getElementById(`content-${tabId}`);
            if (activeEl) activeEl.classList.remove('hidden');

            // Update Nav button styles
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-cyan-400', 'bg-slate-800/80', 'border', 'border-slate-700/50');
                btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.add('text-cyan-400', 'bg-slate-800/80', 'border', 'border-slate-700/50');
                activeBtn.classList.remove('text-slate-300');
            }

            // Close mobile menu if open
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        // Toggle Language (FR <-> EN)
        function toggleLanguage() {
            currentLang = currentLang === 'FR' ? 'EN' : 'FR';
            document.getElementById('current-lang-text').innerText = currentLang;
            updateLanguageUI();
            showToast(currentLang === 'FR' ? 'Langue passée en Français' : 'Language switched to English');
        }

        function updateLanguageUI() {
            const langData = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langData[key]) {
                    // Check if key contains markdown bolding syntax ** text **
                    let text = langData[key];
                    if (text.includes('**')) {
                        text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold">$1</strong>');
                        el.innerHTML = text;
                    } else {
                        el.textContent = text;
                    }
                }
            });
        }

        // Mobile Menu Drawer Toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Filter Projects Grid
        function filterProjects(category) {
            document.querySelectorAll('.project-filter-btn').forEach(btn => {
                btn.classList.remove('bg-cyan-500', 'text-slate-950', 'font-bold');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });

            const activeBtn = document.querySelector(`.project-filter-btn[data-filter="${category}"]`);
            if (activeBtn) {
                activeBtn.classList.add('bg-cyan-500', 'text-slate-950', 'font-bold');
                activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
            }

            document.querySelectorAll('.project-card').forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Simulate CV Download Action
        function downloadCV(lang) {
            const message = lang === 'FR' ? 'Téléchargement du CV Français (PDF)...' : 'Downloading English Resume (PDF)...';
            showToast(message);
        }

        // Copy Text to Clipboard Safely
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(currentLang === 'FR' ? 'Email copié dans le presse-papier !' : 'Email copied to clipboard!');
        }

        // Display Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
